<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СтройГазСервис</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1A365D;
            --secondary-color: #2D5F7D;
            --accent-color: #E63946;
            --light-bg: #F8F9FA;
            --text-color: #2D3748;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Nunito", serif;
        }

        body {
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .maintenance-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(128, 128, 128, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="loader"></div>
        <h1>Сайт находится на техническом обслуживании</h1>
        <p>Приносим извинения за временные неудобства!</p>
        <p style="margin-top: 1.5rem; color: var(--secondary-color);">С уважением,<br>Команда СтройГазСервис</p>
    </div>
</body>
</html>
